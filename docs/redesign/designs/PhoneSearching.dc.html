<!doctype html>

<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;family=DM+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#16120c}
*{box-sizing:border-box}
a{color:#fff8e8}a:hover{color:#ffffff}
@keyframes asp-port{0%{opacity:0;transform:scale(1.04)}1.6%{opacity:1}6.7%{opacity:1;transform:scale(1)}8.4%{opacity:0;transform:scale(.99)}100%{opacity:0;transform:scale(.99)}}
@keyframes asp-dot{0%{background:rgba(255,248,232,.22);transform:scale(1)}1.6%{background:#d9b76a;transform:scale(1.7)}6.7%{background:#d9b76a;transform:scale(1.7)}8.4%{background:rgba(255,248,232,.22);transform:scale(1)}100%{background:rgba(255,248,232,.22);transform:scale(1)}}
@keyframes asp-breathe{0%,100%{opacity:.5}50%{opacity:.95}}
@keyframes asp-fill{0%{transform:scaleX(.1)}100%{transform:scaleX(1)}}
.asp-port{animation:asp-port 30s linear infinite backwards}
.asp-dot{animation:asp-dot 30s linear infinite backwards}
.asp-breathe{animation:asp-breathe 7s ease-in-out infinite}
.asp-fill{transform-origin:left;animation:asp-fill 12s cubic-bezier(.2,0,0,1) infinite}
a:focus-visible,button:focus-visible{outline:3px solid #c7b8fb;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.asp-port,.asp-dot,.asp-breathe,.asp-fill{animation:none!important}}
@keyframes asp-foil{0%,55%{background-position:130% 0,0 0}100%{background-position:-30% 0,0 0}}.asp-foil{animation:asp-foil 8s ease-in-out infinite}@media (prefers-reduced-motion: reduce){.asp-foil{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 375px; height: 667px; overflow: hidden; background: #16120c; color: #fff8e8; font-family: 'DM Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.5">
<div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse 100% 55% at 50% 48%, #3a2e1d 0%, #221b13 50%, #16120c 85%)"></div>

<header style="position: relative; z-index: 2; height: 56px; padding: 0 12px 0 20px; display: flex; align-items: center; justify-content: space-between">
<a href="PhoneAsk.dc.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: #fff8e8">

<span aria-hidden="true" style="width: 1px; height: 26px; flex-shrink: 0; background: linear-gradient(180deg, rgba(217,183,106,0), rgba(217,183,106,0.8), rgba(217,183,106,0))"></span>
<span style="display: inline-flex; flex-direction: column; align-items: stretch; line-height: 1; text-align: left"><span style="display: flex; align-items: center; gap: 6px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; font-size: 12px; letter-spacing: 0.02em; color: #d9b76a">Ask<span aria-hidden="true" style="flex: 1 1 auto; height: 1px; margin-top: 1px; background: linear-gradient(90deg, rgba(217,183,106,0.75), rgba(217,183,106,0))"></span></span><span class="asp-foil" style="display: inline-block; margin-top: 1px; padding-bottom: 0.08em; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap; background-image: linear-gradient(110deg, rgba(255,255,255,0) 42%, rgba(255,251,238,0.95) 50%, rgba(255,255,255,0) 58%), linear-gradient(180deg, #fffaf0 0%, #f6e7bf 36%, #d4ae5c 54%, #b58c3f 62%, #f3dfa6 100%); background-size: 260% 100%, 100% 100%; background-position: 130% 0, 0 0; background-repeat: no-repeat; -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 rgba(0,0,0,0.55))">Śrīla Prabhupāda</span></span>
</a>
<a href="PhoneAsk.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 9999px; border: 1px solid rgba(255,248,232,0.28); font-size: 13px; color: rgba(255,248,232,0.85); text-decoration: none">Cancel</a>
</header>

<div style="position: relative; z-index: 1; padding: 12px 24px 0; text-align: center">
<p style="margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: 0.42em; text-transform: uppercase; color: #d9b76a">You asked</p>
<h1 style="margin: 8px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; font-size: 32px; line-height: 1.08; color: #fff8e8">How to control the mind?</h1>
</div>

<figure aria-label="The disciplic succession, from Śrī Caitanya Mahāprabhu to Śrīla Prabhupāda" style="position: relative; z-index: 1; margin: 18px 0 0; display: flex; flex-direction: column; align-items: center; text-align: center">
<div style="position: relative; width: 300px; height: 330px">
<div class="asp-breathe" aria-hidden="true" style="position: absolute; left: -40px; top: -40px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(217,183,106,0.24) 0%, rgba(217,183,106,0) 60%)"></div>
<sc-for list="{{ lineage }}" as="item" hint-placeholder-count="14">
<div class="asp-port" style="position: absolute; top: 0; left: 0; width: 300px; height: 330px; display: flex; flex-direction: column; align-items: center; opacity: {{ item.op }}; animation-delay: {{ item.delay }}">
<div style="width: 196px; height: 248px; border-radius: 98px 98px 16px 16px; padding: 7px; background: linear-gradient(160deg, rgba(217,183,106,0.75), rgba(217,183,106,0.15) 45%, rgba(167,139,250,0.5)); box-shadow: 0 20px 60px rgba(0,0,0,0.6)">
<div style="width: 100%; height: 100%; border-radius: 91px 91px 10px 10px; background: radial-gradient(ellipse 70% 55% at 50% 38%, #4a3a24 0%, #261e14 60%, #1a150e 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<svg aria-hidden="true" width="52" height="16" viewBox="0 0 64 20" fill="none"><path d="M0 10h22M42 10h22" stroke="#d9b76a" stroke-opacity="0.55"></path><path d="M32 2l8 8-8 8-8-8z" stroke="#d9b76a"></path><circle cx="32" cy="10" r="2" fill="#d9b76a"></circle></svg>
<span style="font-size: 9px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,248,232,0.5)">Painting to come</span>
</div>
</div>
<p style="margin: 14px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 22px; line-height: 1.15; color: #fff8e8">{{ item.name }}</p>
<p style="margin: 4px 0 0; font-size: 11px; letter-spacing: 0.16em; color: #d9b76a; font-variant-numeric: tabular-nums">{{ item.n }} / 15</p>
</div>
</sc-for>
<div class="asp-port" style="position: absolute; top: 0; left: 0; width: 300px; height: 330px; display: flex; flex-direction: column; align-items: center; opacity: 1; animation-delay: 28s">
<div style="width: 196px; height: 248px; border-radius: 98px 98px 16px 16px; padding: 7px; background: linear-gradient(160deg, rgba(217,183,106,0.85), rgba(217,183,106,0.2) 45%, rgba(167,139,250,0.55)); box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 60px rgba(217,183,106,0.25)">
<img src="/images/redesign/photos/folded-hands.webp" alt="Śrīla Prabhupāda with folded hands" style="width: 100%; height: 100%; border-radius: 91px 91px 10px 10px; object-fit: cover; object-position: 50% 18%; display: block" />
</div>
<p style="margin: 14px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 22px; line-height: 1.15; color: #fff8e8">Śrīla Prabhupāda</p>
<p style="margin: 4px 0 0; font-size: 11px; letter-spacing: 0.16em; color: #d9b76a; font-variant-numeric: tabular-nums">15 / 15</p>
</div>
</div>
<div aria-hidden="true" style="display: flex; gap: 6px">
<sc-for list="{{ dots }}" as="item" hint-placeholder-count="15">
<span class="asp-dot" style="width: 5px; height: 5px; border-radius: 9999px; background: rgba(255,248,232,0.22); animation-delay: {{ item.delay }}"></span>
</sc-for>
</div>
</figure>

<div style="position: relative; z-index: 1; margin: 22px 24px 0" role="status">
<p style="margin: 0; display: flex; align-items: baseline; gap: 10px; font-size: 14px; line-height: 1.35"><span aria-hidden="true" style="font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 16px; color: #d9b76a">II</span>Searching the books, lectures and letters</p>
<div style="position: relative; margin-top: 8px; height: 2px; background: rgba(255,248,232,0.16); overflow: hidden"><div class="asp-fill" style="position: absolute; top: 0; left: 0; width: 100%; height: 2px; transform: scaleX(0.55); background: linear-gradient(90deg, #a78bfa, #d9b76a)"></div></div>
</div>

<div style="position: absolute; z-index: 1; left: 0; right: 0; bottom: 8px; display: flex; flex-direction: column; align-items: center">
<a href="PhoneAnswer.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; font-size: 12px; color: rgba(255,248,232,0.55); text-decoration: underline; text-underline-offset: 4px">Prototype only: jump to the answer</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":667}}'>
class Component extends DCLogic {
renderVals() {
const names = [
'Śrī Caitanya Mahāprabhu',
'Svarūpa Dāmodara Gosvāmī',
'Śrīla Rūpa Gosvāmī',
'Śrīla Sanātana Gosvāmī',
'Śrīla Raghunātha dāsa Gosvāmī',
'Śrīla Jīva Gosvāmī',
'Śrīla Kṛṣṇadāsa Kavirāja Gosvāmī',
'Śrīla Narottama dāsa Ṭhākura',
'Śrīla Viśvanātha Cakravartī Ṭhākura',
'Śrīla Baladeva Vidyābhūṣaṇa',
'Śrīla Jagannātha dāsa Bābājī',
'Śrīla Bhaktivinoda Ṭhākura',
'Śrīla Gaurakiśora dāsa Bābājī',
'Śrīla Bhaktisiddhānta Sarasvatī Ṭhākura',
'Śrīla Prabhupāda'
];
const all = names.map((name, i) => ({
name: name,
n: (i + 1 < 10 ? '0' : '') + (i + 1),
delay: (i * 2) + 's',
op: 0
}));
return { lineage: all.slice(0, 14), dots: all };
}
}
</script>
</body>
