class Component extends DCLogic {
componentDidMount() {
this._timer = setInterval(() => this.next(), 9000);
}
componentWillUnmount() {
clearInterval(this._timer);
}
pick(n, avoid) {
let i = Math.floor(Math.random() * n);
let guard = 0;
while (avoid.indexOf(i) >= 0 && guard < 50) { i = Math.floor(Math.random() * n); guard++; }
return i;
}
next() {
const n = QUOTES.length;
const recent = (this.state && this.state.recent) || [this._start];
const cur = (this.state && this.state.cur !== undefined) ? this.state.cur : this._start;
const nxt = this.pick(n, recent.concat([cur]));
this.setState({ prev: cur, cur: nxt, recent: recent.concat([nxt]).slice(-12) });
}
renderVals() {
const n = QUOTES.length;
if (this._start === undefined) this._start = Math.floor(Math.random() * n);
const cur = (this.state && this.state.cur !== undefined) ? this.state.cur : this._start;
const prev = this.state ? this.state.prev : undefined;
const E = 'cubic-bezier(.16,1,.3,1)';
const ON = 'opacity: 1; transform: translate3d(0,0,0); letter-spacing: 0em; transition: opacity 1.8s ' + E + ' .6s, transform 1.8s ' + E + ' .6s, letter-spacing 2.2s ' + E + ' .6s';
const OUT = 'opacity: 0; transform: translate3d(0,-14px,0); letter-spacing: 0em; transition: opacity 1.1s ease, transform 1.1s ease';
const WAIT = 'opacity: 0; transform: translate3d(0,18px,0); letter-spacing: 0.05em; transition: none';
return {
verses: QUOTES.map((q, i) => ({
text: q.text,
source: q.source,
hidden: i === cur ? 'false' : 'true',
st: i === cur ? ON : (i === prev ? OUT : WAIT),
srcSt: i === cur ? 'opacity: 1; transition: opacity 1s ease 1.4s' : 'opacity: 0; transition: opacity .5s ease'
}))
};
}
}
const QUOTES = [{"text": "O my Lord, when will my eyes be decorated with tears of love flowing constantly when I chant Your holy name?", "source": "Śrī Caitanya Mahāprabhu · Śikṣāṣṭakam 6"}, {"text": "O my Lord, Your holy name alone can render all benediction to living beings, and thus You have hundreds and millions of names like Kṛṣṇa and Govinda. In these transcendental names You have invested all Your transcendental energies. There are not even hard and fast rules for chanting these names. O my Lord, out of kindness You enable us to easily approach You by Your holy names, but I am so unfortunate that I have no attraction for them.", "source": "Śrī Caitanya Mahāprabhu · Śikṣāṣṭakam 2 · Teachings of Lord Caitanya"}, {"text": "When will my voice choke up, and when will the hairs of my body stand on end at the recitation of Your name?", "source": "Śrī Caitanya Mahāprabhu · Śikṣāṣṭakam 6"}, {"text": "I offer my respectful obeisances unto Śrī Kṛṣṇa Caitanya and Lord Nityānanda, who are like the sun and moon. They have arisen simultaneously on the horizon of Gauḍa to dissipate the darkness of ignorance and thus wonderfully bestow benediction upon all.", "source": "Śrīla Kṛṣṇadāsa Kavirāja Gosvāmī · Cc. Ādi 1.2"}, {"text": "O Govinda! Feeling Your separation, I am considering a moment to be like twelve years.", "source": "Śrī Caitanya Mahāprabhu · Śikṣāṣṭakam 7"}, {"text": "The holy name, character, pastimes and activities of Kṛṣṇa are all transcendentally sweet like sugar candy. Although the tongue of one afflicted by the jaundice of avidyā [ignorance] cannot taste anything sweet, it is wonderful that simply by carefully chanting these sweet names every day, a natural relish awakens within his tongue, and his disease is gradually destroyed at the root.", "source": "Śrīla Rūpa Gosvāmī · Śrī Upadeśāmṛta 7"}, {"text": "I know no one but Kṛṣṇa as my Lord, and He shall remain so even if He handles me roughly by His embrace, or makes me brokenhearted by not being present before me.", "source": "Śrī Caitanya Mahāprabhu · Śikṣāṣṭakam 8"}, {"text": "O son of Mahārāja Nanda [Kṛṣṇa], I am Your eternal servitor, yet somehow or other I have fallen into the ocean of birth and death. Please pick me up from this ocean of death and place me as one of the atoms at Your lotus feet.", "source": "Śrī Caitanya Mahāprabhu · Śikṣāṣṭakam 5 · Teachings of Lord Caitanya"}, {"text": "I do not want wealth, followers, or beautiful women. I only want Your causeless devotional service, birth after birth.", "source": "Śrī Caitanya Mahāprabhu · Śikṣāṣṭakam 4"}, {"text": "May the Supreme Lord who is known as the son of Śrīmatī Śacī-devī be transcendentally situated in the innermost chambers of your heart. Resplendent with the radiance of molten gold, He has appeared in the Age of Kali by His causeless mercy to bestow what no incarnation has ever offered before: the most sublime and radiant mellow of devotional service, the mellow of conjugal love.", "source": "Śrīla Rūpa Gosvāmī · Cc. Ādi 1.4"}, {"text": "One should chant the holy name in a humble state of mind, thinking oneself lower than the straw in the street — in such a state of mind one can chant the holy name constantly.", "source": "Śrī Caitanya Mahāprabhu · Śikṣāṣṭakam 3"}, {"text": "By the mercy of the spiritual master one is benedicted by the mercy of Kṛṣṇa. Without the grace of the spiritual master, one cannot make any advancement.", "source": "Śrīla Viśvanātha Cakravartī Ṭhākura · quoted in Bhāg. 6.7.23, purport"}, {"text": "Glory to the chanting of the holy name, which cleanses the mirror of the heart and extinguishes the fire of material existence, expanding the ocean of transcendental bliss.", "source": "Śrī Caitanya Mahāprabhu · Śikṣāṣṭakam 1"}, {"text": "When first-class devotional service develops, one must be devoid of all material desires, knowledge obtained by monistic philosophy, and fruitive action. The devotee must constantly serve Kṛṣṇa favorably, as Kṛṣṇa desires.", "source": "Śrīla Rūpa Gosvāmī · Bhakti-rasāmṛta-sindhu 1.1.11 · Cc. Madhya 19.167"}, {"text": "O most munificent incarnation! You are Kṛṣṇa Himself, and You are widely distributing pure love of Kṛṣṇa. We offer our respectful obeisances unto You.", "source": "Śrīla Rūpa Gosvāmī · Caitanya-caritāmṛta, Madhya-līlā 19.53"}, {"text": "The essence of all advice is that one should utilize one’s full time – twenty-four hours a day – in nicely chanting and remembering the Lord’s divine name, transcendental form, qualities and eternal pastimes, thereby gradually engaging one’s tongue and mind. In this way one should reside in Vraja [Goloka Vṛndāvana-dhāma] and serve Kṛṣṇa under the guidance of devotees. One should follow in the footsteps of the Lord’s beloved devotees, who are deeply attached to His devotional service.", "source": "Śrīla Rūpa Gosvāmī · Śrī Upadeśāmṛta 8"}, {"text": "Kaivalya, oneness in the effulgence of Brahman, appears hellish to the devotee who has received the merciful sidelong glance of Lord Gaura.", "source": "Śrīla Prabodhānanda Sarasvatī · Caitanya-candrāmṛta 5"}, {"text": "Offering gifts in charity, accepting charitable gifts, revealing one’s mind in confidence, inquiring confidentially, accepting prasāda and offering prasāda are the six symptoms of love shared by one devotee and another.", "source": "Śrīla Rūpa Gosvāmī · Śrī Upadeśāmṛta 4"}, {"text": "O My Lord! O most merciful master! O master of Mathurā! When shall I see You again? Because of not seeing You, My agitated heart has become unsteady.", "source": "Śrī Mādhavendra Purī · Caitanya-caritāmṛta, Madhya-līlā 4.197"}, {"text": "I offer my respectful obeisances unto the spiritual masters, the devotees of the Lord, the Lord’s incarnations, His plenary portions, His energies and the primeval Lord Himself, Śrī Kṛṣṇa Caitanya.", "source": "Śrīla Kṛṣṇadāsa Kavirāja Gosvāmī · Cc. Ādi 1.1"}, {"text": "My dear friend, if you are indeed attached to your worldly friends, do not look at the smiling face of Lord Govinda as He stands on the bank of the Yamunā at Keśīghāṭa.", "source": "Śrīla Rūpa Gosvāmī · Bhakti-rasāmṛta-sindhu 1.2.239 · Cc. Ādi 5.224"}, {"text": "When love of Godhead awakens in the heart, liberation herself stands before the devotee with folded hands, waiting to render service.", "source": "Bilvamaṅgala Ṭhākura · Śrī Kṛṣṇa-karṇāmṛta, quoted by Śrīla Prabhupāda"}, {"text": "O Lord Hari, I have wasted my life. Having obtained a human birth, I did not worship Rādhā and Kṛṣṇa.", "source": "Narottama dāsa Ṭhākura · Prārthanā"}, {"text": "When shall the day be mine when my body will tremble and tears will flow at the mere utterance of Your name?", "source": "Bhaktivinoda Ṭhākura · Śaraṇāgati"}];
</script>
